<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赞助 · LinQi</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">

    <h1 data-i18n="sponsor_title">赞助</h1>
    <p class="subtitle">sponsor · buy me a coffee</p>

    <p data-i18n="sponsor_intro">
        如果你喜欢这个培养皿，或者觉得这里的内容对你有帮助，
        可以请我喝杯咖啡。你的支持会让我更有动力把这里继续做下去，谢谢。
    </p>

    <!-- ① 选择赞助方式 -->
    <div id="choose">
        <p class="step" data-i18n="choose_method">选择赞助方式</p>
        <div class="opt-group">
            <button class="choice" id="goCrypto" data-i18n="go_crypto">虚拟货币</button>
            <button class="choice" id="goWechat" data-i18n="go_wechat">微信赞赏码</button>
        </div>
        <p class="foot-note"><a href="#" class="supporters-link" id="goSupporters" data-i18n="go_supporters">赞助者名单</a></p>
    </div>

    <!-- ② 虚拟货币面板 -->
    <div id="cryptoPanel" hidden>
        <a href="#" class="back" data-back data-i18n="back">← 返回选择赞助方式</a>

        <p class="step" data-i18n="step1">第一步：选择货币</p>
        <div class="opt-group" id="coins">
            <button class="opt active" data-coin="USDT">USDT</button>
            <button class="opt" data-coin="USDC">USDC</button>
        </div>

        <p class="step" data-i18n="step2">第二步：选择网络</p>
        <div class="opt-group" id="networks">
            <button class="opt active" data-net="TRC20">TRC20</button>
            <button class="opt" data-net="BEP20">BNB Smart Chain</button>
        </div>

        <div class="addr-box">
            <div class="addr-label" id="addrLabel">TRC20 · USDT</div>
            <div class="addr-value" id="addrValue">待补充</div>
            <button class="copy-btn" id="copyBtn" data-i18n="copy">复制地址</button>
        </div>
    </div>

    <!-- ③ 微信赞赏码面板 -->
    <div id="wechatPanel" hidden>
        <a href="#" class="back" data-back data-i18n="back">← 返回选择赞助方式</a>
        <div class="wechat-qr">
            <img src="wechat-qr.png" alt="微信赞赏码">
        </div>
    </div>

    <!-- ④ 赞助者名单面板 -->
    <div id="supportersPanel" hidden>
        <a href="#" class="back" data-back data-i18n="back">← 返回选择赞助方式</a>
        <p class="step" data-i18n="supporters_title">感谢每一位支持者</p>
        <div id="supportersList"></div>
    </div>

    <nav class="pager">
        <a href="about.html" class="pager-btn" data-i18n="prev">← 上一页</a>
        <a href="index.html" class="pager-btn" data-i18n="home_short">首页</a>
        <a href="contact.html" class="pager-btn" data-i18n="next">下一页 →</a>
    </nav>

    <footer>
        <p>© 2026 LinQi</p>
    </footer>

</main>

<script src="i18n.js"></script>
<script src="sponsors.js"></script>
<script>
// 面板切换：先选方式，再进对应界面
const choose = document.getElementById('choose');
const cryptoPanel = document.getElementById('cryptoPanel');
const wechatPanel = document.getElementById('wechatPanel');
const supportersPanel = document.getElementById('supportersPanel');

function show(panel) {
    choose.hidden = true;
    cryptoPanel.hidden = true;
    wechatPanel.hidden = true;
    supportersPanel.hidden = true;
    panel.hidden = false;
}

document.getElementById('goCrypto').onclick = () => show(cryptoPanel);
document.getElementById('goWechat').onclick = () => show(wechatPanel);
document.getElementById('goSupporters').onclick = (e) => {
    e.preventDefault();
    show(supportersPanel);
    renderSupporters();
};
document.querySelectorAll('[data-back]').forEach(b => b.onclick = (e) => {
    e.preventDefault();
    choose.hidden = false;
    cryptoPanel.hidden = true;
    wechatPanel.hidden = true;
    supportersPanel.hidden = true;
});

// 赞助者名单渲染
function renderSupporters() {
    const list = document.getElementById('supportersList');
    list.innerHTML = '';
    if (!SPONSORS || SPONSORS.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-tip';
        empty.setAttribute('data-i18n', 'supporters_empty');
        empty.textContent = I18N[currentLang].supporters_empty;
        list.appendChild(empty);
        return;
    }
    SPONSORS.forEach(s => {
        const card = document.createElement('div');
        card.className = 'supporter-card';

        const head = document.createElement('div');
        head.className = 'supporter-head';
        const name = document.createElement('span');
        name.className = 'supporter-name';
        name.textContent = s.name || '???';
        const amount = document.createElement('span');
        amount.className = 'supporter-amount';
        amount.textContent = s.amount || '';
        head.appendChild(name);
        head.appendChild(amount);

        const date = document.createElement('div');
        date.className = 'supporter-date';
        date.textContent = s.date || '';

        card.appendChild(head);
        card.appendChild(date);

        if (s.message) {
            const msg = document.createElement('div');
            msg.className = 'supporter-msg';
            msg.textContent = s.message;
            card.appendChild(msg);
        }

        list.appendChild(card);
    });
}

// 地址表
const addresses = {
    TRC20: { USDT: "TScamen5YWCWuiZjBQjHaEaWkYiZEp6DJV", USDC: "TScamen5YWCWuiZjBQjHaEaWkYiZEp6DJV" },
    BEP20: { USDT: "0xB69393291027452583Fe5D22BD3405a9F687B472", USDC: "0xB69393291027452583Fe5D22BD3405a9F687B472" }
};

let net = "TRC20", coin = "USDT";
const netNames = { TRC20: "TRC20", BEP20: "BNB Smart Chain" };

function render() {
    document.getElementById('addrLabel').textContent = netNames[net] + ' · ' + coin;
    document.getElementById('addrValue').textContent = addresses[net][coin];
}

function bindGroup(groupId, attr, setter) {
    const group = document.getElementById(groupId);
    group.querySelectorAll('.opt').forEach(btn => {
        btn.onclick = () => {
            group.querySelectorAll('.opt').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            setter(btn.getAttribute(attr));
            render();
        };
    });
}

bindGroup('networks', 'data-net', v => net = v);
bindGroup('coins', 'data-coin', v => coin = v);

// 复制：优先用新 API，手机浏览器不支持时回退到老办法
document.getElementById('copyBtn').onclick = () => {
    const v = addresses[net][coin];
    if (!v || v === "待补充") return;
    const done = () => {
        const cb = document.getElementById('copyBtn');
        cb.textContent = I18N[currentLang].copied;
        setTimeout(() => cb.textContent = I18N[currentLang].copy, 1500);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(v).then(done).catch(() => fallbackCopy(v, done));
    } else {
        fallbackCopy(v, done);
    }
};

// 兼容手机浏览器的复制方式
function fallbackCopy(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
}

render();
</script>
</body>
</html>
