<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赞助 · LinQi</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<main class="page">

    <h1>赞助</h1>
    <p class="subtitle">sponsor · 请我喝杯咖啡</p>

    <p>
        如果你喜欢这个小房间，或者觉得这里的内容对你有帮助，
        可以请我喝杯咖啡。你的支持会让我更有动力把这里继续做下去，谢谢。
    </p>

    <h2>加密货币</h2>

    <p class="step">第一步：选择网络</p>
    <div class="opt-group" id="networks">
        <button class="opt active" data-net="TRC20">TRC20（波场）</button>
        <button class="opt" data-net="ERC20">ERC20（以太坊）</button>
        <button class="opt" data-net="BEP20">BEP20（BSC）</button>
    </div>

    <p class="step">第二步：选择货币</p>
    <div class="opt-group" id="coins">
        <button class="opt active" data-coin="USDT">USDT</button>
        <button class="opt" data-coin="USDC">USDC</button>
    </div>

    <div class="addr-box">
        <div class="addr-label" id="addrLabel">TRC20 · USDT</div>
        <div class="addr-value" id="addrValue">待补充</div>
        <button class="copy-btn" id="copyBtn">复制地址</button>
    </div>

    <h2>微信赞赏码</h2>
    <div class="wechat-qr">
        <!-- 赞赏码图片发来后，把下面这行注释换成 <img src="wechat-qr.jpg" alt="微信赞赏码"> -->
        <p>微信赞赏码 · 待上传</p>
    </div>

    <nav class="pager">
        <a href="about.html">← 上一页</a>
        <span class="num">3 / 4</span>
        <a href="contact.html">下一页 →</a>
    </nav>

    <footer>
        <p>© 2026 LinQi · 本站由 GitHub Pages 支持</p>
    </footer>

</main>

<script>
// 地址表：以后把每个网络 + 货币对应的真实地址填进去即可
const addresses = {
    TRC20: { USDT: "待补充", USDC: "待补充" },
    ERC20: { USDT: "待补充", USDC: "待补充" },
    BEP20: { USDT: "待补充", USDC: "待补充" }
};

let net = "TRC20", coin = "USDT";

function render() {
    document.getElementById('addrLabel').textContent = net + ' · ' + coin;
    document.getElementById('addrValue').textContent = addresses[net][coin];
}

function bindGroup(groupId, attr, setter) {
    const group = document.getElementById(groupId);
    group.querySelectorAll('.opt').forEach(btn => {
        btn.onclick = () => {
            group.querySelectorAll('.opt').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            setter(btn.getAttribute(attr));
            render();
        };
    });
}

bindGroup('networks', 'data-net', v => net = v);
bindGroup('coins', 'data-coin', v => coin = v);

document.getElementById('copyBtn').onclick = () => {
    const v = addresses[net][coin];
    if (v && v !== "待补充" && navigator.clipboard) {
        navigator.clipboard.writeText(v).then(() => {
            document.getElementById('copyBtn').textContent = '已复制 ✓';
            setTimeout(() => document.getElementById('copyBtn').textContent = '复制地址', 1500);
        });
    }
};

render();
</script>

</body>
</html>
