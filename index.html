<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinQi · 个人主页</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 整个页面内容都包在 page 里，居中、限宽 -->
    <main class="page">

        <!-- ===== 头部：头像 + 名字 + 一句话介绍 + 社交入口 ===== -->
        <section class="hero">
            <!-- 圆形头像占位：以后有照片了，把 LQ 换成 <img src="头像.jpg"> 即可 -->
            <div class="avatar">LQ</div>

            <h1>LinQi</h1>
            <!-- tagline：一句话介绍自己的身份 / 领域 -->
            <p class="tagline">学生 · 热爱学习与探索</p>

            <!-- bio：2~3 句自我介绍 -->
            <p class="bio">
                你好，我是 LinQi，一名学生。正在学习编程与网页开发，
                这个网站是我学习和展示作品的第一站，会持续更新。
            </p>

            <!-- 社交媒体入口：只保留真实存在的账号，后续可继续补充 -->
            <div class="socials">
                <a class="pill" href="https://github.com/XuZhihao1234" target="_blank">GitHub</a>
                <a class="pill" href="mailto:marcgreen54210122@gmail.com">邮箱</a>
                <!-- 想加微信/B站/微博等：复制上面一行，改成对应链接即可 -->
            </div>
        </section>

        <!-- ===== 关于我 ===== -->
        <section class="section">
            <h2>关于我</h2>
            <p>
                我是 LinQi，一名在校学生，正在学习编程和网页开发。
                这里会慢慢补充我的学习经历、兴趣和作品，
                欢迎通过邮箱或 GitHub 和我交流。
            </p>
        </section>

        <!-- ===== 技能 / 兴趣 ===== -->
        <section class="section">
            <h2>技能与兴趣</h2>
            <div class="tags">
                <span class="tag">编程</span>
                <span class="tag">网页开发</span>
                <span class="tag">学习</span>
                <span class="tag">探索</span>
            </div>
        </section>

        <!-- ===== 联系我 ===== -->
        <section class="section">
            <h2>联系我</h2>
            <p>想交流、合作或交朋友，欢迎通过这些方式找到我：</p>
            <div class="socials">
                <a class="pill" href="mailto:marcgreen54210122@gmail.com">邮箱</a>
                <a class="pill" href="https://github.com/XuZhihao1234" target="_blank">GitHub</a>
            </div>
        </section>

        <!-- 页脚：版权信息 -->
        <footer>
            <p>© 2026 LinQi · 由 GitHub Pages 免费托管</p>
        </footer>

    </main>
</body>
</html>
